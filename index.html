        function calculateGeocentric(id, T, earth) {
            const p = PLANET_DATA[id];
            const L = Astro.norm(p.L[0] + p.L[1] * T);

            const E = M + p.e * Astro.DEG * Math.sin(M * Astro.RAD);
            const xv = p.a * (Math.cos(E * Astro.RAD) - p.e);
            const yv = p.a * (Math.sqrt(1 - p.e * p.e) * Math.sin(E * Astro.RAD));
            const r = Math.sqrt(xv * xv + yv * yv);
            const v = Math.atan2(yv, xv) * Astro.DEG;
            const hLon = Astro.norm(v + p.p);
            const xh = r * Math.cos(hLon * Astro.RAD);
            const yh = r * Math.sin(hLon * Astro.RAD);
            const xe = earth.r * Math.cos(earth.lon * Astro.RAD);
            const ye = earth.r * Math.sin(earth.lon * Astro.RAD);
            return Astro.norm(Math.atan2(yh - ye, xh - xe) * Astro.DEG);

            const momentCardContent = `
                <div style="background: #000; width: 100%; border-radius: 12px 12px 0 0; position: absolute; top: 0; left: 0; height: 18%; z-index: 5; display: flex; align-items: center; justify-content: center; padding: 0.5rem;">
                    <div style="border: 1.5px solid #FFD700; border-radius: 6px; padding: 3.5px; display: flex; align-items: center; gap: 8px; min-height: 36px; max-width: 100%;">
                        <div style="font-size: 8px; color: #a0aec0; font-weight: 800; letter-spacing: 0.5px; border-right: 1px solid rgba(255,255,255,0.2); padding-right: 8px; line-height: 1.2; text-align: right; min-width: max-content;">5 MOMENTS<br>OF THE DAY</div>
                        <div class="asc-title" style="color: #FFD700; font-size: 11px; line-height: 1.3; white-space: nowrap;">${moment.name.toUpperCase()}</div>
                    </div>
                </div>
                <div style="position: absolute; bottom: 0; left: 0; right: 0; background: rgba(0, 0, 0, 0.6); padding: 0.5rem 0.75rem; border-radius: 0 0 12px 12px; display: flex; align-items: center; justify-content: center; z-index: 3;">
                <div style="position: absolute; bottom: 0; left: 0; right: 0; background: rgba(0, 0, 0, 0.6); padding: 0.5rem 0.75rem; border-radius: 0 0 12px 12px; display: flex; align-items: center; justify-content: center; z-index: 3;">
                    <div id="bar-asc-moment" style="display: flex; gap: 2px; width: 70%; max-width: 90px; height: 20px;">${getMomentProgress(longitude)}</div>
                </div>
                </div>
                <div id="moment-poster-bg" style="position: absolute; top: 18%; bottom: 15%; left: 0; width: 100%; height: auto; background-image: url('${momentImage}'); background-position: center center; background-size: contain; background-repeat: no-repeat; z-index: 0;"></div>
            `;

            // Calculate song for Ascendant
            const ascDecanNumber = Math.floor(d / 10) + 1;
            const ascSignTracks = ZODIAC_TRACKS[sign] || [];
            const ascSongName = ascSignTracks[ascDecanNumber - 1] || "Unknown Song";

            const decanCardContent = `
                <div style="background: #000; width: 100%; border-radius: 12px 12px 0 0; position: absolute; top: 0; left: 0; height: 18%; z-index: 5; display: flex; align-items: center; justify-content: center; padding: 0.5rem;">
                    <div style="border: 1.5px solid #FFD700; border-radius: 6px; padding: 3.5px; display: flex; align-items: center; gap: 8px; min-height: 38px; max-width: 100%;">
                        <div style="font-size: 8px; color: #a0aec0; font-weight: 800; letter-spacing: 0.5px; border-right: 1px solid rgba(255,255,255,0.2); padding-right: 8px; line-height: 1.2; text-align: right; min-width: max-content;">NOW<br>PLAYING</div>
                        <div class="asc-title" style="color: #FFD700; font-size: 11px; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1;">${ascSongName.toUpperCase()}</div>
                    </div>
                </div>
                <div style="position: absolute; bottom: 0; left: 0; right: 0; background: rgba(0, 0, 0, 0.6); padding: 0.5rem 0.75rem; border-radius: 0 0 12px 12px; display: flex; align-items: center; justify-content: center; gap: 0.5rem;">
                    <div style="display: flex; gap: 2px; width: 70%; max-width: 90px; height: 20px;">${getDecanProgress(d)}</div>
                </div>
            `;

            return `
            <div class="asc-row">
                <div class="flip-card decan-card" id="card-asc-deg" style="background: #000 url('assets/decan_${getDecanNumber(longitude)}.png') center center / contain no-repeat; position: relative;">${decanCardContent}</div>
                <div class="flip-card" id="card-asc-moment" style="background: #000; position: relative;">${momentCardContent}</div>
                <div ${hourCardStyle} style="background: #000; border: 1px solid #333;">${hourCardContent}</div>
                <div class="flip-card degree-card" style="background: #fff; position: relative;">
                    <div style="background: #fff; width: 100%; border-radius: 12px 12px 0 0; position: absolute; top: 0; left: 0; height: 18%; z-index: 5; display: flex; align-items: center; justify-content: center; padding: 0.5rem;">
                        <div style="font-family: 'Impact', 'Arial Black', sans-serif; font-size: 24px; color: #1a202c; letter-spacing: 2px; text-transform: uppercase;">MINUTES</div>
                    </div>
                    <div class="asc-value flip-clock-display" id="val-asc-min">${String(d).padStart(2, '0')}</div>
                </div>
                <div class="flip-card degree-card" style="background: #fff; position: relative;">
                    <div style="background: #fff; width: 100%; border-radius: 12px 12px 0 0; position: absolute; top: 0; left: 0; height: 18%; z-index: 5; display: flex; align-items: center; justify-content: center; padding: 0.5rem;">
                        <div style="font-family: 'Impact', 'Arial Black', sans-serif; font-size: 24px; color: #1a202c; letter-spacing: 2px; text-transform: uppercase;">SECONDS</div>
                    </div>
                    <div class="asc-value flip-clock-display" id="val-asc-sec">${String(s).padStart(2, '0')}</div>
                </div>
            </div>`;
        }

        function createPlanetRow(name, symbol, zSymbol, zName, degree, longitude) {
            const charCardAttr = getCharacterStyle(name);
            const albumName = ALBUM_NAMES[zName] || zName;
            const decanNumber = Math.floor(degree / 10) + 1;

            // Map song directly from the sign (album) and decan
            const signTracks = ZODIAC_TRACKS[zName] || [];
            const songName = signTracks[decanNumber - 1] || "Unknown Song";

            // Shared Badge Style for visual anchor consistency
            const badgeStyle = "position: absolute; top: 7%; left: 50%; transform: translateX(-50%); text-align: center; z-index: 3; border: 2px solid #FFD700; padding: 4px 12px; border-radius: 6px; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); white-space: nowrap; min-height: 38px; display: flex; align-items: center; justify-content: center;";

            return `
                <div class="planet-row">
                <div ${charCardAttr} style="position: relative;">
                    <div class="asc-icon" style="margin: auto; height: 100%; display: flex; align-items: center; justify-content: center;">${symbol}</div>
                    <div style="position: absolute; bottom: 1.5rem; left: 50%; transform: translateX(-50%); display: flex; gap: 2px; width: 70%; max-width: 90px; height: 20px;">${getDecanProgress(degree)}</div>
                </div>
                <div class="flip-card" style="background: #000; position: relative; display: flex; flex-direction: column; justify-content: flex-end; padding: 0 1rem 1.5rem 1rem;">
                    <div style="${badgeStyle}">
                        <div style="display: flex; gap: 0.75rem; align-items: center;">
                            <div style="font-size: 8px; color: #a0aec0; font-weight: 800; letter-spacing: 1px; border-right: 1px solid rgba(255,255,255,0.2); padding-right: 10px;">ALBUM</div>
                            <div style="text-align: left;">
                                <div style="font-size: 1rem; font-weight: 700; color: #fff; line-height: 1.1;">${albumName}</div>
                            </div>
                        </div>
                    </div>
                    <div id="planet-poster-${name}" style="position: absolute; top: 0; bottom: 0; left: 0; width: 100%; height: auto; background-image: url('${BACKGROUNDS[zName]}'); background-position: center center; background-size: contain; background-repeat: no-repeat; z-index: 0;"></div>
                    <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 1;"><img src="${SIGN_ICONS[zName]}" style="width: 80px; height: 80px; filter: brightness(0) invert(1) opacity(0.7);" /></div>
                </div>
                <div class="flip-card decan-card" id="card-${name}-deg" style="background: white url('assets/decan_${getDecanNumber(longitude)}.png') center center / contain no-repeat; position: relative;">
                    <div style="${badgeStyle}">
                        <div style="display: flex; gap: 0.75rem; align-items: center;">
                            <div style="font-size: 8px; color: #a0aec0; font-weight: 800; letter-spacing: 1px; border-right: 1px solid rgba(255,255,255,0.2); padding-right: 10px;">SONG</div>
                            <div style="text-align: left;">
                                <div style="font-size: 1rem; font-weight: 700; color: #fff; line-height: 1.1;">${songName.toUpperCase()}</div>
                            </div>
                        </div>
                    </div>
                    <div style="position: absolute; bottom: 0; left: 0; right: 0; background: rgba(255, 255, 255, 0.9); padding: 0 1.5rem; display: flex; align-items: center; justify-content: flex-end; border-radius: 0 0 12px 12px; height: 2.25rem; z-index: 5;">
                        <div class="asc-value" style="font-size: 18px; color: #000; font-weight: 800; letter-spacing: 1px;">${String(degree).padStart(2, '0')}°</div>
                    </div>
                </div>
            </div>`;
        }

        // ============================================================================
        // INITIALIZATION & MAIN LOOP
        // ============================================================================
        const PLANET_IDS = ['Moon', 'Sun', 'Mercury', 'Venus', 'Mars', 'Jupiter', 'Saturn'];

        function calculatePositions() {
            const now = new Date(); const jd = Astro.getJD(now); const T = Astro.getT(jd);
            const mainContainer = document.getElementById('mainContainer');
            const sunLon = Astro.norm(PLANET_DATA.Sun.L[0] + PLANET_DATA.Sun.L[1] * T);
            const earth = { r: 1.0, lon: Astro.norm(sunLon + 180) };
            const ascAngle = calculateAscendant(jd, T); const ascZ = getZodiacSign(ascAngle);
            const ascFract = ascAngle - Math.floor(ascAngle);
            ascZ.sec = Math.floor((ascFract * 240) % 60);

            if (mainContainer.innerHTML === '') {
                let html = renderAscendantRow(ascZ.symbol, ascZ.name, ascZ.degree, ascZ.min, ascZ.sec, ascAngle);
                PLANET_IDS.forEach(id => {
                    let lon = (id === 'Sun') ? sunLon : (id === 'Moon' ? Astro.norm(PLANET_DATA.Moon.L[0] + PLANET_DATA.Moon.L[1] * T + 6.29 * Math.sin((134.96 + 477198.86 * T) * Astro.RAD)) : calculateGeocentric(id, T, earth));
                    const z = getZodiacSign(lon); html += createPlanetRow(id, PLANET_DATA[id].symbol, z.symbol, z.name, z.degree, lon);
                });
                mainContainer.innerHTML = html;
                return;
            }

            // Updates
            const elCoverBg = document.getElementById('asc-cover-bg'); const elCenterIcon = document.getElementById('asc-center-icon');
            if (elCoverBg && elCenterIcon && elCenterIcon.src.indexOf(SIGN_ICONS[ascZ.name]) === -1) {
                elCoverBg.style.backgroundImage = `url('${BACKGROUNDS[ascZ.name]}')`; elCenterIcon.src = SIGN_ICONS[ascZ.name];
            }
            const moment = getCurrentMoment(ascAngle); const elMomentBg = document.getElementById('moment-poster-bg');
            const elMomentTitle = document.querySelector('#card-asc-moment .asc-title');
            if (elMomentBg && elMomentTitle && elMomentBg.style.backgroundImage.indexOf(MOMENT_IMAGES[moment.name]) === -1) {
                elMomentBg.style.backgroundImage = `url('${MOMENT_IMAGES[moment.name]}')`; elMomentTitle.textContent = moment.name.toUpperCase();
            }

            // Update Ascendant Song
            const ascDecanNumber = Math.floor(ascZ.degree / 10) + 1;
            const ascSignTracks = ZODIAC_TRACKS[ascZ.name] || [];
            const ascSongName = ascSignTracks[ascDecanNumber - 1] || "Unknown Song";
            const elAscSong = document.querySelector('#card-asc-deg .asc-title');
            if (elAscSong && elAscSong.textContent !== ascSongName.toUpperCase()) {
                elAscSong.textContent = ascSongName.toUpperCase();
            }
            const elAscDecanCard = document.getElementById('card-asc-deg');
            if (elAscDecanCard) {
                // Check if background needs update (optimization: compare current URL)
                const newBgParams = `url('assets/decan_${getDecanNumber(ascAngle)}.png')`;
                if (elAscDecanCard.style.backgroundImage.indexOf(`decan_${getDecanNumber(ascAngle)}.png`) === -1) {
                    elAscDecanCard.style.backgroundImage = newBgParams;
                }
            }

            const elMomentBar = document.getElementById('bar-asc-moment'); if (elMomentBar) elMomentBar.innerHTML = getMomentProgress(ascAngle);
            const elBarAsc = document.getElementById('bar-asc-hour'); if (elBarAsc) elBarAsc.innerHTML = getSignProgress(ascZ.degree);
            updateElement('val-asc-min', `${String(ascZ.degree).padStart(2, '0')}`); updateElement('val-asc-sec', `${String(ascZ.sec).padStart(2, '0')}`);
            PLANET_IDS.forEach(id => {
                let lon = (id === 'Sun') ? sunLon : (id === 'Moon' ? Astro.norm(PLANET_DATA.Moon.L[0] + PLANET_DATA.Moon.L[1] * T + 6.29 * Math.sin((134.96 + 477198.86 * T) * Astro.RAD)) : calculateGeocentric(id, T, earth));
                updatePlanet(id, getZodiacSign(lon).degree);
            });
            document.getElementById('footer').textContent = `Running Internal Engine • ${now.toLocaleTimeString()}`;
        }

        function createStars() {
            const container = document.getElementById('stars');
            for (let i = 0; i < 50; i++) {
                const s = document.createElement('div'); s.className = 'star';
                s.style.width = (Math.random() * 2 + 1) + 'px'; s.style.height = s.style.width;
                s.style.top = Math.random() * 100 + '%'; s.style.left = Math.random() * 100 + '%';
                s.style.animationDelay = Math.random() * 3 + 's'; container.appendChild(s);
            }
        }

        createStars(); calculatePositions(); setInterval(calculatePositions, 1000);

        // ============================================================================
        // SECTION 5: COMPONENT COMBINATION MANUAL (Card Assembly Guide)
        // ============================================================================
        /**
         * 1. ASCENDANT ROW: Generated by `renderAscendantRow()`. Pulls from `getCurrentMoment`, `MOMENT_IMAGES`, `SIGN_ICONS`.
         * 2. PLANET ROWS: Generated by `createPlanetRow()`. Combines `PLANET_DATA`, `CHARACTERS`, `BACKGROUNDS`.
         * 3. LOGIC: `calculatePositions()` drives all real-time updates for degrees, moments, and energy bars.
         */
    </script>
</body>

</html>
