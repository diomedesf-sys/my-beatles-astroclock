<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Round Beatles Astroclock - Dashboard</title>
    <style>
        body {
            display: flex;
            flex-direction: column; 
            align-items: center;
            min-height: 100vh;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
            font-family: sans-serif;
            box-sizing: border-box;
        }
        
        .dashboard-title {
            margin: 0 0 30px 0;
            font-size: 1.5rem;
            color: #333;
            letter-spacing: 2px;
            text-align: center;
            text-transform: uppercase;
        }

        /* "WHERE ARE THEY NOW?" PANEL */
        .dashboard-subtitle {
            margin: 30px 0 12px 0;
            font-size: 0.75rem;
            color: #888;
            letter-spacing: 3px;
            text-align: center;
            text-transform: uppercase;
        }

        .ephemeris-panel {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .ephemeris-row {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px;
            margin: 0 0 20px 0;
        }

        .ephemeris-btn {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 2px solid #cbd5e1;
            background-color: #fff;
            background-size: cover;
            background-position: center;
            cursor: pointer;
            padding: 0;
            transition: all 0.15s ease;
        }

        .ephemeris-btn:hover {
            transform: scale(1.1);
        }

        .ephemeris-btn.active {
            border-color: #d4af37;
            box-shadow: 0 0 8px rgba(212, 175, 55, 0.6);
        }

        /* Half-size song card, hidden until a planet is selected */
        .eph-card-wrapper {
            width: 70px;
            height: 87.5px;
            display: none;
        }

        .eph-card-wrapper .card-petit {
            transform: scale(0.5);
            transform-origin: top left;
        }

        /* 1. THE APP WRAPPER */
        .app-layout {
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            gap: 40px; 
            width: 100%;
            max-width: 1400px;
        }

        /* 2. THE LEFT PANEL */
        .left-panel {
            display: flex;
            flex-direction: column;
            gap: 15px; 
            width: 295px; /* Just wide enough for two petit cards + gap */
            flex-shrink: 0;
        }

        /* 3. THE ROWS */
        .card-row-center {
            display: flex;
            justify-content: center; /* Centers the top card (The Pyramid Tip) */
            width: 100%;
        }

        .card-row-split {
            display: flex;
            justify-content: space-between; /* Places the two cards side by side */
            width: 100%;
        }

        /* 4. THE PETIT CARD BASE */
        .card-petit {
            width: 140px;
            height: 175px; /* 4:5 Aspect Ratio */
            background-color: #000;
            border-radius: 12px;
            border: 1px solid #222;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        /* 5. BLACK CARD INNER STYLING */
        .card-top-label {
            height: 25%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 5px;
        }

        .card-pill {
            border: 1px solid #FFD700;
            border-radius: 4px;
            padding: 3px 5px;
            display: flex;
            align-items: center;
            gap: 5px;
            max-width: 95%; /* Keeps it from touching the edges */
        }

        .pill-label {
            font-size: 5px;
            color: #a0aec0;
            font-weight: 800;
            letter-spacing: 0.5px;
            border-right: 1px solid rgba(255,255,255,0.2);
            padding-right: 5px;
            text-transform: uppercase;
            text-align: right;
            line-height: 1.2;
        }

        .pill-value {
            font-size: 7px; /* Very small so full names fit */
            color: #FFD700;
            font-weight: bold;
            text-transform: uppercase;
            line-height: 1.2;
            white-space: normal; /* Allows text to wrap to a second line if very long */
            text-align: left;
        }

        .card-artwork {
            flex-grow: 1;
            background-size: contain; /* Prevents stretching, gives breathing room */
            background-position: center;
            background-repeat: no-repeat;
            margin: 0 10px; /* The breathing room space */
        }

        .card-progress {
            height: 15%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 2px;
            padding-bottom: 5px;
        }

        /* 6. THE FLIP CLOCKS (White Cards) */
        .card-white {
            background-color: #ffffff;
            border: 1px solid #cbd5e1;
            align-items: center;
        }

        .time-label {
            font-family: 'Impact', 'Arial Black', sans-serif;
            font-size: 14px;
            color: #1a202c;
            letter-spacing: 1px;
            text-transform: uppercase;
            height: 25%;
            display: flex;
            align-items: center;
        }

        .flip-clock-display {
            background: #202020;
            color: #ffffff;
            border-radius: 8px;
            position: relative;
            width: 85%;
            flex-grow: 1;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.4), inset 0 2px 5px rgba(255, 255, 255, 0.1);
            font-family: 'Arial', sans-serif;
            font-size: 3.5rem;
            letter-spacing: -2px;
            line-height: 1;
            font-weight: 700;
        }

        .flip-clock-display::after {
            content: "";
            position: absolute;
            top: 50%;
            left: 0;
            width: 100%;
            height: 2px;
            background: #000;
            box-shadow: 0 1px 0 rgba(255, 255, 255, 0.15);
            z-index: 3;
        }

        /* 7. THE CLOCK (Protagonist Size) */
        .astroclock-container {
            width: 75vmin;  
            height: 75vmin;
            min-width: 300px;
            min-height: 300px;
            background-color: white;
            border-radius: 50%;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        svg { width: 100%; height: 100%; }
        .ring { fill: none; stroke: #333; stroke-width: 3; }
        .divider { stroke: #666; stroke-width: 2; stroke-dasharray: 5, 5; }

        /* RESPONSIVE STACKING */
        @media (max-width: 1000px) {
            .app-layout { flex-direction: column; }
            .left-panel { order: 2; }
            .astroclock-container { order: 1; width: 85vmin; height: 85vmin; margin-bottom: 30px; }
        }
    </style>
</head>
<body>

    <h1 class="dashboard-title">Beatles AstroClock</h1>

    <div class="app-layout">
        
        <!-- LEFT DASHBOARD PANEL (Petit 1-2-2 Grid) -->
        <div class="left-panel">
            
            <!-- Row 1: SONG (Centered Pyramid Tip) -->
            <div class="card-row-center">
                <div class="card-petit">
                    <div class="card-top-label">
                        <div class="card-pill">
                            <div class="pill-label">NOW<br>PLAYING</div>
                            <div class="pill-value" id="ui-song">Calculating...</div>
                        </div>
                    </div>
                    <div class="card-artwork" id="art-song" style="background-image: url('assets/decan_1.png');"></div>
                    <div class="card-progress" id="bar-song"></div>
                </div>
            </div>

            <!-- Row 2: MINUTES & SECONDS (Split Base) -->
            <div class="card-row-split">
                <div class="card-petit card-white">
                    <div class="time-label">MINUTES</div>
                    <div class="flip-clock-display" id="ui-min">--</div>
                </div>
                <div class="card-petit card-white">
                    <div class="time-label">SECONDS</div>
                    <div class="flip-clock-display" id="ui-sec">--</div>
                </div>
            </div>

            <!-- Row 3: ALBUM & MOVIE (Split Base) -->
            <div class="card-row-split">
                <div class="card-petit">
                    <div class="card-top-label">
                        <div class="card-pill">
                            <div class="pill-label">HOUR</div>
                            <div class="pill-value" id="ui-album">Loading...</div>
                        </div>
                    </div>
                    <div class="card-artwork" id="art-album" style="background-image: url('assets/cover_aries.jpg');"></div>
                    <div class="card-progress" id="bar-album"></div>
                </div>
                <div class="card-petit">
                    <div class="card-top-label">
                        <div class="card-pill">
                            <div class="pill-label">5 MOMENTS<br>OF THE DAY</div>
                            <div class="pill-value" id="ui-movie">Loading...</div>
                        </div>
                    </div>
                    <div class="card-artwork" id="art-movie" style="background-image: url('assets/Matutina.png');"></div>
                    <div class="card-progress" id="bar-movie"></div>
                </div>
            </div>

        </div>

        <!-- ASTROCLOCK -->
        <div class="astroclock-container">
            <svg viewBox="-500 -500 1000 1000" xmlns="http://www.w3.org/2000/svg">
                <g id="background-layer">
                    <image id="main-background" href="assets/beatles-calendar.svg" x="-841" y="-851" width="1700" height="1700" />
                </g>
                <circle class="ring" cx="0" cy="0" r="480" stroke-width="5" />
                <circle class="ring" cx="0" cy="0" r="380" />
                <circle class="ring" cx="0" cy="0" r="280" />
                <circle class="ring" cx="0" cy="0" r="180" />
                <circle class="ring" cx="0" cy="0" r="80" /> 
                <g id="dividers">
                    <line class="divider" x1="0" y1="-480" x2="0" y2="480" transform="rotate(0)" />
                    <line class="divider" x1="0" y1="-480" x2="0" y2="480" transform="rotate(30)" />
                    <line class="divider" x1="0" y1="-480" x2="0" y2="480" transform="rotate(60)" />
                    <line class="divider" x1="0" y1="-480" x2="0" y2="480" transform="rotate(90)" />
                    <line class="divider" x1="0" y1="-480" x2="0" y2="480" transform="rotate(120)" />
                    <line class="divider" x1="0" y1="-480" x2="0" y2="480" transform="rotate(150)" />
                </g>
                <g id="planets-layer">
                    <image id="billy-sun" href="assets/billy-shears.svg" x="0" y="0" width="50" height="50" />
                    <image id="madonna-moon" href="assets/lady-madonna.svg" x="0" y="0" width="50" height="50" />
                    <image id="michell-mercury" href="assets/michell.svg" x="0" y="0" width="50" height="50" />
                    <image id="sadie-venus" href="assets/sexy-sadie.svg" x="0" y="0" width="50" height="50" />
                    <image id="pepper-mars" href="assets/sgt-pepper.svg" x="0" y="0" width="50" height="50" />
                    <image id="merigold-jupiter" href="assets/king-merigold.svg" x="0" y="0" width="50" height="50" />
                    <image id="mckenzie-saturn" href="assets/father-mckenzie.svg" x="0" y="0" width="50" height="50" />
                    <image id="ascendant" href="assets/ascendant.svg" x="0" y="0" width="80" height="80" />
                </g>
            </svg>
        </div>

    </div>

    <!-- WHERE ARE THEY NOW? -->
    <div class="ephemeris-panel">
        <p class="dashboard-subtitle">What Are They Playing?</p>
        <div class="ephemeris-row">
            <button class="ephemeris-btn" id="select-sun" data-planet="sun" style="background-image: url('assets/billy-shears.svg');"></button>
            <button class="ephemeris-btn" id="select-moon" data-planet="moon" style="background-image: url('assets/lady-madonna.svg');"></button>
            <button class="ephemeris-btn" id="select-mercury" data-planet="mercury" style="background-image: url('assets/michell.svg');"></button>
            <button class="ephemeris-btn" id="select-venus" data-planet="venus" style="background-image: url('assets/sexy-sadie.svg');"></button>
            <button class="ephemeris-btn" id="select-mars" data-planet="mars" style="background-image: url('assets/sgt-pepper.svg');"></button>
            <button class="ephemeris-btn" id="select-jupiter" data-planet="jupiter" style="background-image: url('assets/king-merigold.svg');"></button>
            <button class="ephemeris-btn" id="select-saturn" data-planet="saturn" style="background-image: url('assets/father-mckenzie.svg');"></button>
        </div>
        <div class="card-row-center">
            <div class="eph-card-wrapper" id="eph-card-wrapper">
                <div class="card-petit" id="eph-card">
                    <div class="card-top-label">
                        <div class="card-pill">
                            <div class="pill-label">NOW<br>PLAYING</div>
                            <div class="pill-value" id="ui-eph-song"></div>
                        </div>
                    </div>
                    <div class="card-artwork" id="art-eph-song"></div>
                    <div class="card-progress" id="bar-eph-song"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function placeItemOnRing(elementId, degrees, ringRadius) {
            const mathDegrees = degrees + 180;
            const radians = mathDegrees * (Math.PI / 180);
            const x = ringRadius * Math.cos(radians);
            const y = -(ringRadius * Math.sin(radians));
            const element = document.getElementById(elementId);
            const width = parseFloat(element.getAttribute('width'));
            const imageOffset = width / 2; 
            element.setAttribute('x', x - imageOffset);
            element.setAttribute('y', y - imageOffset);
        }

        const Astro = {
            RAD: Math.PI / 180, DEG: 180 / Math.PI,
            norm: (a) => { a %= 360; return a < 0 ? a + 360 : a; },
            getDeltaT: () => 69.4,
            getJD: (date) => (date.getTime() / 86400000) + 2440587.5,
            getT: (jd) => {
                const dt = Astro.getDeltaT() / 86400;
                return (jd + dt - 2451545.0) / 36525.0;
            }
        };

        const PLANET_DATA = {
            Sun: { L: [280.466, 36000.769], a: 1.000, e: 0.0167, p: 282.94, symbol: '☉' },
            Moon: { L: [218.316, 481267.881], a: 0.002, e: 0.0549, p: 83.35, symbol: '☽' },
            Mercury: { L: [252.251, 149472.674], a: 0.387, e: 0.2056, p: 77.45, symbol: '☿' },
            Venus: { L: [181.980, 58517.815], a: 0.723, e: 0.0067, p: 131.53, symbol: '♀' },
            Mars: { L: [355.453, 19140.302], a: 1.523, e: 0.0934, p: 336.04, symbol: '♂' },
            Jupiter: { L: [34.404, 3034.746], a: 5.202, e: 0.0484, p: 14.72, symbol: '♃' },
            Saturn: { L: [49.944, 1222.113], a: 9.554, e: 0.0555, p: 92.43, symbol: '♄' }
        };

        const OBSERVER_LAT = 43.7570; // Plymouth, NH
        const OBSERVER_LON = -71.6884;

        const ZODIAC_NAMES = ['Aries', 'Taurus', 'Gemini', 'Cancer', 'Leo', 'Virgo', 'Libra', 'Scorpio', 'Sagittarius', 'Capricorn', 'Aquarius', 'Pisces'];

        const ALBUM_NAMES = {
            'Aquarius': 'Abbey Road', 'Aries': 'Please Please Me', 'Cancer': 'Beatles For Sale',
            'Capricorn': 'The White Album', 'Gemini': 'A Hard Day\'s Night', 'Leo': 'Help!',
            'Libra': 'Revolver', 'Pisces': 'Let It Be', 'Sagittarius': 'Magical Mystery Tour',
            'Scorpio': 'Sgt. Pepper\'s', 'Taurus': 'With The Beatles', 'Virgo': 'Rubber Soul'
        };

        const BACKGROUNDS = {
            'Aquarius': 'assets/cover_aquarius.jpg', 'Aries': 'assets/cover_aries.jpg',
            'Cancer': 'assets/cover_cancer.png', 'Capricorn': 'assets/cover_capricorn.png',
            'Gemini': 'assets/cover_gemini.jpg', 'Leo': 'assets/cover_leo.png',
            'Libra': 'assets/cover_libra.png', 'Pisces': 'assets/cover_pisces.jpg',
            'Sagittarius': 'assets/cover_sagittarius.jpg', 'Scorpio': 'assets/cover_scorpio.jpg',
            'Taurus': 'assets/cover_taurus.png', 'Virgo': 'assets/cover_virgo.jpg'
        };

        const ZODIAC_TRACKS = {
            "Aries": ["Twist And Shout", "Please Please Me", "I Saw Her Standing There"],
            "Taurus": ["Please Mr. Postman", "Till There Was You", "Money"],
            "Gemini": ["I'm So Happy Just To Dance With You", "Can't Buy Me Love", "If I Fell"],
            "Cancer": ["Eight Days A Week", "I'll Follow The Sun", "Mr. Moonlight"],
            "Leo": ["Help", "I've Just Seen A Face", "Act Naturally"],
            "Virgo": ["I'm Looking Through You", "The Word", "Think For Yourself"],
            "Libra": ["I'm Only Sleeping", "Got To Get You Into My Life", "Tomorrow Never Knows"],
            "Scorpio": ["Within You, Without You", "Getting Better", "With A Little Help From My Friends"],
            "Sagittarius": ["All You Need Is Love", "The Magical Mystery Tour", "Baby, You Are a Rich Man"],
            "Capricorn": ["Dear Prudence", "Blackbird", "While My Guitar Gently Weeps"],
            "Aquarius": ["Come Together", "The End", "Because"],
            "Pisces": ["Let It Be", "Across The Universe", "I Got A Feeling"]
        };

        const MOMENT_NAMES = ['Matutina', 'Meridiana', 'Vespera', 'Nocturna', 'Aurora'];
        const MOMENT_IMAGES = {
            'Matutina': 'assets/Matutina.png', 'Meridiana': 'assets/Meridiana.png',
            'Vespera': 'assets/Vespera.png', 'Nocturna': 'assets/Nocturna.png',
            'Aurora': 'assets/Aurora.png'
        };

        function calculateGeocentric(id, T, earth) {
            const p = PLANET_DATA[id];
            const L = Astro.norm(p.L[0] + p.L[1] * T);
            const M = Astro.norm(L - p.p);
            const E = M + p.e * Astro.DEG * Math.sin(M * Astro.RAD);
            const xv = p.a * (Math.cos(E * Astro.RAD) - p.e);
            const yv = p.a * (Math.sqrt(1 - p.e * p.e) * Math.sin(E * Astro.RAD));
            const r = Math.sqrt(xv * xv + yv * yv);
            const v = Math.atan2(yv, xv) * Astro.DEG;
            const hLon = Astro.norm(v + p.p);
            const xh = r * Math.cos(hLon * Astro.RAD);
            const yh = r * Math.sin(hLon * Astro.RAD);
            const xe = earth.r * Math.cos(earth.lon * Astro.RAD);
            const ye = earth.r * Math.sin(earth.lon * Astro.RAD);
            return Astro.norm(Math.atan2(yh - ye, xh - xe) * Astro.DEG);
        }

        function calculateAscendant(jd, T) {
            const gmst = (280.4606 + 360.985647 * (jd - 2451545.0)) % 360;
            const lmst = (gmst + OBSERVER_LON + 360) % 360;
            const eps = 23.439 - 0.013 * T;
            const num = Math.cos(lmst * Astro.RAD);
            const den = -Math.sin(lmst * Astro.RAD) * Math.cos(eps * Astro.RAD) - Math.tan(OBSERVER_LAT * Astro.RAD) * Math.sin(eps * Astro.RAD);
            return Astro.norm(Math.atan2(num, den) * Astro.DEG);
        }

        // A "minute" is one whole degree within the sign (0-29).
        // A "second" is 1/30th of that degree (0-29).
        // 1 minute ~= 4 real minutes, 1 second ~= 8 real seconds.
        function getMinuteSecond(longitude) {
            const normalized = ((longitude % 360) + 360) % 360;
            const positionInSign = normalized % 30;
            const minute = Math.floor(positionInSign);
            const fraction = positionInSign - minute;
            const second = Math.floor(fraction * 30);
            return { minute, second };
        }

        function getZodiacSign(deg) {
            let longitude = deg % 360;
            if (longitude < 0) longitude += 360;
            return ZODIAC_NAMES[Math.floor(longitude / 30)];
        }

        function getDecanNumber(deg) {
            let d = deg % 360;
            if (d < 0) d += 360;
            return Math.floor(d / 10) + 1;
        }

        // Each of the 5 moments/films spans exactly 72deg (5 x 72 = 360).
        const MOMENT_SPAN = 72;

        function getCurrentMoment(ascendantDegree) {
            let d = ascendantDegree % 360;
            if (d < 0) d += 360;
            const momentIndex = Math.min(4, Math.floor(d / MOMENT_SPAN));
            return MOMENT_NAMES[momentIndex];
        }

        // --- ENERGY BAR FUNCTIONS IMPORTED FROM INDEX_2.HTML ---
        function getDecanProgress(degree) {
            const decanDegree = degree % 10; let bars = '';
            for (let i = 0; i < 10; i++) {
                const filled = i < decanDegree;
                const barStyle = filled ? 'background: #4f46e5; box-shadow: 0 0 4px rgba(79, 70, 229, 0.5);' : 'background: #e2e8f0;';
                bars += `<div style="flex: 1; height: 100%; border-radius: 2px; ${barStyle}"></div>`;
            }
            return `<div style="display: flex; gap: 2px; width: 60%; height: 6px;">${bars}</div>`;
        }

        function getMomentProgress(ascendantDegree) {
            let d = ascendantDegree % 360;
            if (d < 0) d += 360;
            const offsetInMoment = d % MOMENT_SPAN;
            const filledBars = Math.min(7, Math.floor((offsetInMoment / MOMENT_SPAN) * 7) + 1);
            let bars = '';
            for (let i = 0; i < 7; i++) {
                const filled = i < filledBars;
                const barStyle = filled ? 'background: #4f46e5; box-shadow: 0 0 4px rgba(79, 70, 229, 0.5);' : 'background: #e2e8f0;';
                bars += `<div style="flex: 1; height: 100%; border-radius: 2px; ${barStyle}"></div>`;
            }
            return `<div style="display: flex; gap: 2px; width: 50%; height: 6px;">${bars}</div>`;
        }

        function getSignProgress(degree) {
            let bars = ''; const filledBars = Math.floor(degree / 3);
            for (let i = 0; i < 10; i++) {
                const filled = i < filledBars;
                const barStyle = filled ? 'background: #4f46e5; box-shadow: 0 0 4px rgba(79, 70, 229, 0.5);' : 'background: #e2e8f0;';
                bars += `<div style="flex: 1; height: 100%; border-radius: 2px; ${barStyle}"></div>`;
            }
            return `<div style="display: flex; gap: 2px; width: 60%; height: 6px;">${bars}</div>`;
        }

        // "Where Are They Now?" panel state
        let selectedPlanet = null;
        let lastPlanetLongitudes = {};

        function renderEphemeris() {
            const wrapperEl = document.getElementById('eph-card-wrapper');
            const titleEl = document.getElementById('ui-eph-song');
            const artEl = document.getElementById('art-eph-song');
            const barEl = document.getElementById('bar-eph-song');
            if (!selectedPlanet || !(selectedPlanet in lastPlanetLongitudes)) {
                wrapperEl.style.display = 'none';
                return;
            }
            wrapperEl.style.display = 'block';
            const lon = lastPlanetLongitudes[selectedPlanet];
            const sign = getZodiacSign(lon);
            const ms = getMinuteSecond(lon);
            const decanInSign = Math.floor(ms.minute / 10);
            const songName = (ZODIAC_TRACKS[sign] || [])[decanInSign] || 'Unknown Song';
            titleEl.textContent = songName;
            artEl.style.backgroundImage = `url('assets/decan_${getDecanNumber(lon)}.png')`;
            barEl.innerHTML = getDecanProgress(ms.minute);
        }

        document.querySelectorAll('.ephemeris-btn').forEach((btn) => {
            btn.addEventListener('click', () => {
                const alreadySelected = btn.dataset.planet === selectedPlanet;
                document.querySelectorAll('.ephemeris-btn').forEach((b) => b.classList.remove('active'));
                if (alreadySelected) {
                    selectedPlanet = null;
                } else {
                    btn.classList.add('active');
                    selectedPlanet = btn.dataset.planet;
                }
                renderEphemeris();
            });
        });

        function updateClockHands() {
            const now = new Date();
            const jd = Astro.getJD(now);
            const T = Astro.getT(jd);

            const sunLon = Astro.norm(PLANET_DATA.Sun.L[0] + PLANET_DATA.Sun.L[1] * T);
            const earth = { r: 1.0, lon: Astro.norm(sunLon + 180) };
            const moonLon = Astro.norm(PLANET_DATA.Moon.L[0] + PLANET_DATA.Moon.L[1] * T + 6.29 * Math.sin((134.96 + 477198.86 * T) * Astro.RAD));
            const mercuryLon = calculateGeocentric('Mercury', T, earth);
            const venusLon = calculateGeocentric('Venus', T, earth);
            const marsLon = calculateGeocentric('Mars', T, earth);
            const jupiterLon = calculateGeocentric('Jupiter', T, earth);
            const saturnLon = calculateGeocentric('Saturn', T, earth);
            const ascLon = calculateAscendant(jd, T);

            placeItemOnRing('billy-sun', sunLon, 480);
            placeItemOnRing('madonna-moon', moonLon, 480);
            placeItemOnRing('michell-mercury', mercuryLon, 480);
            placeItemOnRing('sadie-venus', venusLon, 480);
            placeItemOnRing('pepper-mars', marsLon, 480);
            placeItemOnRing('merigold-jupiter', jupiterLon, 480);
            placeItemOnRing('mckenzie-saturn', saturnLon, 480);
            placeItemOnRing('ascendant', ascLon, 310);

            lastPlanetLongitudes = {
                sun: sunLon, moon: moonLon, mercury: mercuryLon,
                venus: venusLon, mars: marsLon, jupiter: jupiterLon, saturn: saturnLon
            };
            renderEphemeris();

            // Update Minutes and Seconds
            const ascendantMS = getMinuteSecond(ascLon);
            document.getElementById('ui-min').textContent = String(ascendantMS.minute).padStart(2, '0');
            document.getElementById('ui-sec').textContent = String(ascendantMS.second).padStart(2, '0');

            // Draw Energy Bars
            document.getElementById('bar-song').innerHTML = getDecanProgress(ascendantMS.minute);
            document.getElementById('bar-album').innerHTML = getSignProgress(ascendantMS.minute);
            document.getElementById('bar-movie').innerHTML = getMomentProgress(ascLon);

            // NOW PLAYING: song picked from the ascendant's sign + decan-within-sign
            const sign = getZodiacSign(ascLon);
            const decanInSign = Math.floor(ascendantMS.minute / 10);
            const songName = (ZODIAC_TRACKS[sign] || [])[decanInSign] || 'Unknown Song';
            document.getElementById('ui-song').textContent = songName;
            document.getElementById('art-song').style.backgroundImage = `url('assets/decan_${getDecanNumber(ascLon)}.png')`;

            // HOUR: album cover tied to the ascendant's zodiac sign
            document.getElementById('ui-album').textContent = ALBUM_NAMES[sign] || sign;
            document.getElementById('art-album').style.backgroundImage = `url('${BACKGROUNDS[sign]}')`;

            // 5 MOMENTS OF THE DAY: current moment of the day
            const moment = getCurrentMoment(ascLon);
            document.getElementById('ui-movie').textContent = moment;
            document.getElementById('art-movie').style.backgroundImage = `url('${MOMENT_IMAGES[moment]}')`;
        }

        updateClockHands();
        setInterval(updateClockHands, 1000); 
    </script>
</body>
